ServerName localhost
ServerTokens Prod
ServerSignature Off

<Directory /var/www/html>
    Options -Indexes
    AllowOverride None
</Directory>

# Internal files are not served
<DirectoryMatch "^/var/www/html/(includes|templates\.d|\.git)">
    Require all denied
</DirectoryMatch>
<FilesMatch "^(rotate-logs\.php|.*\.sql|.*-dist)$">
    Require all denied
</FilesMatch>
